<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stagehand</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="stagehand.css">
<link rel="stylesheet" id="theme" href="themes/classic.css">
<style>
  /* The grid view, used for previews on the make page. */
  body.grid { overflow: auto; background: var(--sh-ink); padding: 16px; }
  body.grid .sh-gridwrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  body.grid .sh-thumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 6px; background: var(--sh-bg); box-shadow: 0 0 0 1px rgba(127,127,127,0.25); }
  body.grid .sh-thumb > .deck, body.grid .sh-thumb > .sh-cardthumb { width: 1920px; height: 1080px; position: absolute; left: 0; top: 0; transform-origin: 0 0; opacity: 1; visibility: visible; transition: none; }
  body.grid .sh-thumb .deck > section { opacity: 1; visibility: visible; transform: none; transition: none; }
  body.grid .sh-thumb .reveal { opacity: 1; }
  body.grid .sh-thumb .reveal.only { opacity: 0; }
  body.grid .sh-cardthumb { width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse 55% 38% at 50% 50%, var(--sh-glow), transparent 70%), var(--sh-gate); font-family: var(--sh-display); color: var(--sh-text); }
  body.grid .sh-cardthumb .eyebrow { margin-bottom: 40px; letter-spacing: 0.5em; color: var(--sh-muted) !important; }
  body.grid .sh-cardthumb h1 { font-size: 128px; font-weight: var(--sh-title-weight); text-transform: var(--sh-head-case); letter-spacing: calc(var(--sh-head-track) * 1.75); margin: 0; line-height: 1.02; }
  body.grid .sh-cardthumb .rule { width: 160px; margin: 44px 0 28px; }
  body.grid .sh-cardthumb .sub { font-size: 40px; font-style: var(--sh-lede-style); color: var(--sh-soft); margin: 0; }
  body.grid .sh-cardthumb .credit { font-family: var(--sh-ui); font-size: 18px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--sh-muted); margin: 60px 0 0; }
  body.grid .sh-cardthumb aside { display: none; }
  .sh-missing { font: 16px/1.5 Inter, system-ui, sans-serif; color: #EDE6D8; max-width: 560px; margin: 20vh auto; padding: 0 16px; }
</style>
</head>
<body>
<script type="module">
/*
 * md.html shows a Markdown file as a Stagehand deck.
 *
 *   md.html?src=talk.md             a file on the same site
 *   md.html?src=talk.md&theme=paper with a theme, overriding the file's own
 *   md.html?id=…                    a file dropped on make.html, kept in this browser
 *   md.html?…&view=grid             every slide at once, for previews
 */
import { markdownToDeck, fitSlides, THEMES } from './markdown.js';

const q = new URLSearchParams(location.search);
const grid = q.get('view') === 'grid';
let text = null, key = 'example';
try {
  if (q.get('id')) { key = 'md-' + q.get('id'); text = localStorage.getItem('stagehand:md:' + q.get('id')); }
  else if (q.get('src')) { key = q.get('src'); const r = await fetch(q.get('src')); if (r.ok) text = await r.text(); }
  else { const r = await fetch('example.md'); if (r.ok) text = await r.text(); }
} catch (e) {}

if (text == null) {
  document.body.innerHTML = '<div class="sh-missing"><p>That deck is not here. Decks dropped on the make page are kept in the browser you dropped them in, so open it there, or drop the file again.</p><p><a style="color:#E2B866" href="make.html">Go to the make page</a></p></div>';
} else {
  const { html, meta } = markdownToDeck(text);
  const theme = (q.get('theme') || meta.theme || 'classic').toLowerCase();
  if (THEMES[theme]) document.getElementById('theme').href = `themes/${theme}.css`;
  document.title = meta.title;
  document.body.insertAdjacentHTML('afterbegin', html);
  const deck = document.querySelector('.deck');
  deck.dataset.key = key + ':' + theme;
  await new Promise(r => { const l = document.getElementById('theme'); l.sheet ? r() : l.addEventListener('load', r, { once: true }); setTimeout(r, 1500); });
  await document.fonts.ready;
  // Lay the slides out once, at full size, to shrink any that overflow.
  deck.style.cssText = 'position:absolute;left:-99999px;top:0;width:1920px;height:1080px';
  for (const s of deck.querySelectorAll(':scope > section')) s.style.visibility = 'visible';
  fitSlides(deck);
  for (const s of deck.querySelectorAll(':scope > section')) s.style.visibility = '';
  deck.removeAttribute('style');

  if (grid) {
    document.body.classList.add('grid');
    const wrap = document.createElement('div'); wrap.className = 'sh-gridwrap';
    const card = deck.querySelector(':scope > .title-card');
    const items = [];
    if (card) { const c = document.createElement('div'); c.className = 'sh-cardthumb'; c.innerHTML = card.innerHTML; items.push(c); }
    for (const s of deck.querySelectorAll(':scope > section')) { const d = document.createElement('div'); d.className = 'deck'; d.appendChild(s); items.push(d); }
    for (const el of items) { const t = document.createElement('div'); t.className = 'sh-thumb'; t.appendChild(el); wrap.appendChild(t); }
    deck.remove(); document.body.appendChild(wrap);
    const size = () => wrap.querySelectorAll('.sh-thumb').forEach(t => { t.firstChild.style.transform = `scale(${t.clientWidth / 1920})`; });
    size(); addEventListener('resize', size);
    parent.postMessage({ type: 'stagehand-grid', height: document.documentElement.scrollHeight, slides: meta.slides }, '*');
  } else {
    await import('./stagehand.js');
  }
}
</script>
</body>
</html>
