<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stagehand</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="stagehand.css">
<link rel="stylesheet" id="theme" href="themes/classic.css">
<style>
  /* The grid view, used for previews on the start page. */
  body.grid { overflow: auto; background: var(--sh-ink); padding: 16px; }
  body.grid .sh-gridwrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  body.grid .sh-thumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 6px; background: var(--sh-bg); box-shadow: 0 0 0 1px rgba(127,127,127,0.25); }
  body.grid .sh-thumb > .deck, body.grid .sh-thumb > .sh-cardthumb { width: 1920px; height: 1080px; position: absolute; left: 0; top: 0; transform-origin: 0 0; opacity: 1; visibility: visible; transition: none; }
  body.grid .sh-thumb .deck > section { opacity: 1; visibility: visible; transform: none; transition: none; }
  body.grid .sh-thumb .reveal { opacity: 1; }
  body.grid .sh-thumb .reveal.only { opacity: 0; }
  body.grid .sh-cardthumb { width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse 55% 38% at 50% 50%, var(--sh-glow), transparent 70%), var(--sh-gate); font-family: var(--sh-display); color: var(--sh-text); }
  body.grid .sh-cardthumb .eyebrow { margin-bottom: 40px; letter-spacing: 0.5em; color: var(--sh-muted) !important; }
  body.grid .sh-cardthumb h1 { font-size: 128px; font-weight: var(--sh-title-weight); text-transform: var(--sh-head-case); letter-spacing: calc(var(--sh-head-track) * 1.75); margin: 0; line-height: 1.02; }
  body.grid .sh-cardthumb .rule { width: 160px; margin: 44px 0 28px; }
  body.grid .sh-cardthumb .sub { font-size: 40px; font-style: var(--sh-lede-style); color: var(--sh-soft); margin: 0; }
  /* One slide filling the frame, for the start page's pictures. */
  body.grid.cover { padding: 0; overflow: hidden; background: var(--sh-bg); }
  body.grid.cover .sh-gridwrap { display: block; }
  body.grid.cover .sh-thumb { border-radius: 0; box-shadow: none; }
  body.grid .sh-cardthumb .credit { font-family: var(--sh-ui); font-size: 18px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--sh-muted); margin: 60px 0 0; }
  body.grid .sh-cardthumb aside { display: none; }
  /* The print view, one slide per page, for saving a PDF. */
  @page { size: 1920px 1080px; margin: 0; }
  body.print { overflow: visible; background: var(--sh-bg); padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body.print .sh-gridwrap { display: block; }
  body.print .sh-thumb { width: 1920px; height: 1080px; aspect-ratio: auto; border-radius: 0; box-shadow: none; break-after: page; page-break-after: always; }
  body.print .sh-thumb:last-child { break-after: auto; page-break-after: auto; }
  @media screen { body.print { background: #333; } body.print .sh-gridwrap { zoom: 0.5; } body.print .sh-thumb { margin: 0 auto 40px; } }
  .sh-printnote { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5; font: 15px/1.4 Inter, system-ui, sans-serif; color: #1A1408; background: #E2B866; border-radius: 8px; padding: 10px 16px; }
  @media print { .sh-printnote { display: none; } }
  /* In the start page's preview, a slide can be clicked to leave a note for Claude. */
  body.grid:not(.cover):not(.print) .sh-thumb { cursor: pointer; transition: box-shadow 0.15s; }
  body.grid:not(.cover):not(.print) .sh-thumb:hover { box-shadow: 0 0 0 2px rgba(226, 184, 102, 0.6); }
  body.grid .sh-thumb.picked { box-shadow: 0 0 0 3px #E2B866; }
  body.grid .sh-thumb.noted::after { content: "Note"; position: absolute; top: 8px; right: 8px; z-index: 5; font: 600 11px/1 Inter, system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #1A1408; background: #E2B866; border-radius: 4px; padding: 4px 6px; }
  .sh-missing { font: 16px/1.5 Inter, system-ui, sans-serif; color: #EDE6D8; max-width: 560px; margin: 20vh auto; padding: 0 16px; }
</style>
</head>
<body>
<script type="module" src="md.js"></script>
</body>
</html>
