# Runs the tests, the linter and the formatting check on every push and pull
# request. Nothing to install: Node comes with the runner and npx fetches the
# rest. GitHub Pages publishes the site on its own, separately from this.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
